<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Meal Prep Planner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
</head>
<body data-page="login">
<main class="auth-page" hidden>
    <section class="card auth-card">
        <h1>Log in</h1>
        <p class="muted">Sign in to see your pantry and saved meals.</p>
        <form id="login-form">
            <label>Email <input name="email" type="email" required maxlength="254" autocomplete="email"></label>
            <label>Password <input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
            <div class="actions">
                <button type="submit">Log in</button>
            </div>
        </form>
        <p id="auth-error" class="error" role="alert"></p>
        <p class="auth-links"><a href="/Welcome.html">Welcome</a> · <a href="/signup.html">Create an account</a></p>
    </section>
</main>
<script src="auth.js"></script>
</body>
</html>
