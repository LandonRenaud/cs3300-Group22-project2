<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal Prep Planner</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<header>
    <h1>Meal Prep Planner</h1>
    <nav>
        <a href="#ingredients">Ingredients</a>
    </nav>
</header>

<main>
    <section id="ingredients">
        <h2>Ingredient Tracker</h2>

        <form id="ingredient-form" class="card">
            <input type="hidden" name="id">
            <div class="row">
                <label>Name <input name="name" required maxlength="100" placeholder="e.g. Eggs"></label>
                <label>Quantity <input name="quantity" type="number" min="0" step="any" required value="1"></label>
                <label>Unit <input name="unit" placeholder="item, g, cup..."></label>
                <label>Expires <input name="expirationDate" type="date"></label>
            </div>
            <fieldset>
                <legend>Nutrition per unit (optional)</legend>
                <div class="row">
                    <label>Calories <input name="calories" type="number" min="0" step="any"></label>
                    <label>Protein (g) <input name="proteinGrams" type="number" min="0" step="any"></label>
                    <label>Carbs (g) <input name="carbsGrams" type="number" min="0" step="any"></label>
                    <label>Fat (g) <input name="fatGrams" type="number" min="0" step="any"></label>
                </div>
            </fieldset>
            <div class="actions">
                <button type="submit" id="ingredient-submit">Add ingredient</button>
                <button type="button" id="ingredient-cancel" class="secondary" hidden>Cancel edit</button>
                <span id="ingredient-error" class="error" role="alert"></span>
            </div>
        </form>

        <div class="card">
            <table>
                <thead>
                <tr>
                    <th>Name</th><th>On hand</th><th>Expires</th><th>Calories (total)</th><th></th>
                </tr>
                </thead>
                <tbody id="ingredient-rows"></tbody>
            </table>
            <p id="ingredient-empty" class="muted">No ingredients yet. Add what you bought above.</p>
            <p id="nutrition-total" class="muted"></p>
        </div>
    </section>
</main>

<script src="api.js"></script>
<script src="ingredients.js"></script>
</body>
</html>
